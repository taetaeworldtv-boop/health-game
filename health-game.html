<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7일의 회복 - 건강 되찾기 게임</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#2b2f2a;--sub:#6b7068;--line:#e2ded3;--green:#3f8f5a;--red:#d1594a;--blue:#4a7fb5;--amber:#d89a2b;--btn:#f0f5ee}
@media (prefers-color-scheme:dark){:root{--bg:#171a17;--card:#222622;--ink:#ecefe9;--sub:#a0a79c;--line:#343a33;--btn:#2a312a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.6}
#app{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
h1{margin:4px 0 8px;font-size:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{font-size:13px;color:var(--sub)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;transition:width .5s}
.stat b{color:var(--ink)}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);margin-bottom:10px}
.emoji{font-size:48px;line-height:1}
.scene h2{margin:8px 0 6px;font-size:20px}
.scene p{margin:0;font-size:16px}
.choice{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:10px;cursor:pointer;transition:transform .1s,border-color .1s}
.choice:hover{border-color:var(--green);transform:translateY(-1px)}
.primary{background:var(--green);color:#fff;border:0;text-align:center;font-weight:700}
.delta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.up{color:var(--green)}.down{color:var(--red)}
.tip{background:var(--btn);border-left:4px solid var(--amber);padding:10px 12px;border-radius:8px;font-size:14px;margin-top:10px}
.sub{color:var(--sub);font-size:14px}
.hero{display:flex;gap:12px;align-items:center}
</style>
</head>

 {l:"폰을 충전기에 꽂고 멀리 두고 눕는다",fx:{h:6,e:5,m:4},r:"빠르게 잠이 든다.",tip:"취침 전 화면의 블루라이트는 멜라토닌 분비를 방해합니다."},
 {l:"딱 10분만... (새벽 2시)",fx:{h:-6,e:-6,m:-3},r:"어느새 새벽. 내일이 벌써 두렵다.",tip:"수면 부족은 식욕 호르몬을 교란시켜 폭식을 부릅니다."}]},
{e:"🍷",t:"친구의 술 약속",d:"오랜만에 친구가 한잔하자고 연락했다.",c:[
 {l:"무알코올 음료로 대화를 즐긴다",fx:{h:4,e:1,m:5},r:"웃고 떠들었더니 스트레스가 풀렸다.",tip:"모임의 즐거움은 지키되 알코올은 줄일 수 있어요."},
 {l:"소주 3병, 2차까지 달린다",fx:{h:-10,e:-6,m:2},r:"다음 날 숙취가 고통스럽다.",tip:"과음은 간 건강과 수면을 모두 해칩니다."},
 {l:"피곤하다고 거절한다",fx:{h:1,e:2,m:-2},r:"몸은 쉬었지만 조금 외롭다.",tip:"사회적 관계도 건강의 중요한 일부예요."}]},
{e:"🛁",t:"밤의 루틴",d:"하루가 끝나간다. 샤워 후 시간이 조금 남았다.",c:[
 {l:"따뜻한 차를 마시고 10분 일기를 쓴다",fx:{h:4,e:3,m:6},r:"마음이 차분히 정리된다.",tip:"감정 기록은 스트레스 해소에 효과적입니다."},
 {l:"뉴스와 SNS를 밤새 본다",fx:{h:-3,e:-3,m:-5},r:"불안한 소식에 마음이 더 어수선해졌다.",tip:"밤의 자극적인 콘텐츠는 불안과 불면을 키워요."}]},
]};

const ENDINGS=[
 {min:85,e:"🌟",t:"완벽한 회복",d:"7일 전의 지친 몸은 이제 없다. 가볍고 활기찬 몸과 맑은 정신으로 새 일상을 시작한다. 작은 습관의 힘이 삶을 바꿨다."},
 {min:65,e:"😊",t:"눈에 띄는 호전",d:"몸이 한결 가벼워졌고 식습관도 자리 잡아간다. 이 흐름만 이어가면 건강을 완전히 되찾을 수 있다."},
 {min:40,e:"😐",t:"반쯤의 변화",d:"좋은 선택도, 아쉬운 선택도 있었다. 건강은 한 번의 큰 결심이 아니라 매일의 반복이다. 다시 도전해보자."},
 {min:0,e:"😵",t:"아직은 갈 길이 멀다",d:"오래된 습관은 쉽게 바뀌지 않는다. 하지만 지금 알게 된 것들이 다음 번 선택을 바꿔줄 것이다."}
];

let S;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){
  S={day:1,slot:0,h:35,e:50,m:50,good:0,total:0,log:[],bag:{}};
  for(const k of SLOTS)S.bag[k]=[];
  next();
}
function pick(slot){
  if(!S.bag[slot].length)S.bag[slot]=shuffle(POOL[slot].map((_,i)=>i));
  return POOL[slot][S.bag[slot].pop()];
}
let cur;
function next(){cur=pick(SLOTS[S.slot]);renderScene()}

function statsHTML(){
  const row=(n,v,c)=>`<div class="stat">${n} <b>${v}</b><div class="bar"><i style="width:${v}%;background:${c}"></i></div></div>`;
  return `<div class="card"><div class="top"><span>📅 ${S.day}일차 / ${DAYS}일 · ${SLOTS[S.slot]}</span><span>🥇 좋은 선택 ${S.good}/${S.total}</span></div>
  <div class="stats">${row("❤️ 건강",S.h,"var(--green)")}${row("⚡ 에너지",S.e,"var(--amber)")}${row("🧘 멘탈",S.m,"var(--blue)")}</div></div>`;
}
function renderScene(){
  $("#app").innerHTML=statsHTML()+`<div class="card scene"><div class="emoji">${cur.e}</div><h2>${cur.t}</h2><p>${cur.d}</p>
  ${cur.c.map((c,i)=>`<button class="choice" onclick="choose(${i})">${c.l}</button>`).join("")}</div>`;
}
function chip(n,v){if(!v)return"";return `<span class="chip ${v>0?"up":"down"}">${n} ${v>0?"+":""}${v}</span>`}
function choose(i){
  const c=cur.c[i],f=c.fx;
  S.h=clamp(S.h+f.h);S.e=clamp(S.e+f.e);S.m=clamp(S.m+f.m);
  S.total++;if(f.h>=3)S.good++;
  const best=Math.max(...cur.c.map(x=>x.fx.h));
  const bestTxt=f.h<best?`<div class="sub" style="margin-top:8px">💡 더 좋은 선택: "${cur.c.find(x=>x.fx.h===best).l}"</div>`:"";
  $("#app").innerHTML=statsHTML()+`<div class="card scene"><div class="emoji">${cur.e}</div><h2>${c.l}</h2><p>${c.r}</p>
  <div class="delta">${chip("건강",f.h)}${chip("에너지",f.e)}${chip("멘탈",f.m)}</div>
  <div class="tip">📌 ${c.tip}</div>${bestTxt}
  <button class="choice primary" onclick="advance()">계속하기</button></div>`;
}
function advance(){
  if(S.h<=0||S.e<=0&&S.m<=0)return end(true);
  S.slot++;
  if(S.slot>=SLOTS.length){
    S.slot=0;
    if(S.day>=DAYS)return end(false);
    return daySummary();
  }
  next();
}
function daySummary(){
  S.day++;
  const msg=S.h>=70?"몸이 확실히 달라지고 있어요. 이 기세로 가봅시다!":S.h>=40?"조금씩 나아지고 있어요. 더 신경 써볼까요?":"아직 몸이 무겁네요. 오늘은 더 건강한 선택을 해봐요.";
  $("#app").innerHTML=statsHTML()+`<div class="card scene"><div class="emoji">🌙</div><h2>${S.day-1}일차 마무리</h2><p>${msg}</p>
  <button class="choice primary" onclick="next()">${S.day}일차 시작</button></div>`;
}
function end(fail){
  let E;
  if(fail)E={e:"🚑",t:"쓰러지다",d:"무리한 생활을 이어가다 몸이 한계에 달했다. 병원에서 눈을 뜨며 깨닫는다. 건강은 잃기 전에 지켜야 한다는 것을."};
  else E=ENDINGS.find(x=>S.h>=x.min);
  $("#app").innerHTML=`<div class="card scene" style="text-align:center"><div class="emoji">${E.e}</div><h1>${E.t}</h1><p>${E.d}</p>
  <div class="delta" style="justify-content:center">${chip("최종 건강",S.h)}<span class="chip">좋은 선택 ${S.good}/${S.total}</span></div>
  <button class="choice primary" onclick="newGame()">다시 도전하기</button></div>`;
}
function title(){
  $("#app").innerHTML=`<div class="card scene"><div class="emoji">🩺</div><h1>7일의 회복</h1>
  <p>지훈(38)은 만성 피로와 잦은 야근, 불규칙한 식사로 건강이 무너졌다. 의사는 말했다. <b>"생활 습관을 바꾸지 않으면 다음은 없습니다."</b></p>
  <p class="sub" style="margin-top:10px">7일 동안 매 순간의 선택으로 건강을 되찾아보자. 식사, 운동, 수면, 스트레스, 인간관계가 모두 영향을 준다.</p>
  <button class="choice primary" onclick="newGame()">게임 시작</button></div>`;
}
title();
</script>
</body>
</html>
